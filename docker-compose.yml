version: "3.9"

services:
  docustruct-vlm:
    build:
      context: .
      dockerfile: Dockerfile
    image: docustruct-vlm:latest
    container_name: docustruct_vlm_engine
    ports:
      - "8000:8000"
    environment:
      - SIMULATION_MODE=true
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
